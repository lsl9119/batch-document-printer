name: WPS real-environment E2E (Windows runner)

# 在 GitHub 的 Windows runner 上安装 WPS Office（国际版，chocolatey 包 wps-office-free），
# 执行真实的 COM 冒烟测试和打印到"文件端口虚拟 PDF 打印机"的端到端测试。
# 注意：runner 是 Windows Server，且 WPS 首次启动可能弹出协议/登录窗口，因此该工作流
# 结果仅作参考；正式验收仍以 Windows 10/11 桌面 + WPS 的人工验证为准。
on:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  wps-e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Environment
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Format-List
          foreach ($p in 'Word.Application','Excel.Application','PowerPoint.Application') {
            "$p registered: $([bool](Get-Item "Registry::HKEY_CLASSES_ROOT\$p" -ErrorAction SilentlyContinue))"
          }
      - name: Install WPS Office (official installer, Authenticode verified)
        shell: pwsh
        timeout-minutes: 30
        run: |
          # chocolatey 的 wps-office-free 包校验和已过期，这里直接从 WPS 官方 CDN 下载，
          # 并要求安装程序带有有效的金山（Kingsoft）Authenticode 签名后才执行
          $url = "https://wdl1.pcfg.cache.wpscdn.com/wpsdl/wpsoffice/download/11.2.0.10223/WPSOffice_11.2.0.10223.exe"
          $exe = "$env:RUNNER_TEMP\WPSOffice_setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $sig = Get-AuthenticodeSignature $exe
          "Signature: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          "SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Kingsoft') { throw "WPS 安装程序签名无效" }
          $p = Start-Process -FilePath $exe -ArgumentList '/S','-agreelicense' -PassThru
          $deadline = (Get-Date).AddMinutes(25)
          while ((Get-Date) -lt $deadline) {
            $ok = @('KWPS.Application','KET.Application','KWPP.Application') | ForEach-Object {
              [bool](Get-Item "Registry::HKEY_CLASSES_ROOT\$_" -ErrorAction SilentlyContinue) }
            if (-not ($ok -contains $false)) { "WPS COM registered"; break }
            Start-Sleep -Seconds 15
          }
          Get-Process | Where-Object { $_.Name -match 'wps|et|wpp|setup|install' } | Format-Table Id, Name, Path -AutoSize
          foreach ($p in 'KWPS.Application','KET.Application','KWPP.Application') {
            "$p registered: $([bool](Get-Item "Registry::HKEY_CLASSES_ROOT\$p" -ErrorAction SilentlyContinue))"
          }
          # 结束安装后自动启动的 WPS 界面进程，保证测试从干净状态开始
          Get-Process -Name wps,et,wpp,wpscenter,wpscloudsvr -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Create file-port PDF test printer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\setup_test_pdf_printer.ps1 -OutputFile C:\bdp_test\out.pdf
      - name: WPS COM smoke test
        run: python scripts/test_wps_com.py --timeout 180 --json wps_com.json
      - name: Real print E2E
        run: python scripts/e2e_real_print.py --printer "BDP Test PDF" --port-file C:\bdp_test\out.pdf --native --out-dir e2e_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wps-e2e-report
          path: |
            wps_com.json
            e2e_output/
            logs/
